<title>Invest Rapporten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* Layout: één rustige kolom; lichte, koele grond met één elektrisch accent. Grote cijfers dragen het ontwerp. */
:root {
  color-scheme: light;
  --grond: #f3f5f9;
  --vlak: #ffffff;
  --inkt: #0d1021;
  --inkt-2: #474d63;
  --inkt-3: #7a8098;
  --rand: #e4e7ef;
  --accent: #3b5bff;
  --accent-donker: #2a44d6;
  --accent-zacht: #eef1ff;
  --nacht: #0d1021;
  --kopen: #0e9f6e; --houden: #3b5bff; --verkopen: #e5484d; --afwachten: #d48806; --onvoldoende: #7a8098;
  --kopen-z: #e7f8f1; --houden-z: #eef1ff; --verkopen-z: #fdeced; --afwachten-z: #fdf4e3; --onvoldoende-z: #f0f1f5;
  --nogo: #e5484d; --hoog: #e8590c; --middel: #d48806; --info: #7a8098;
  --f-kop: "Bricolage Grotesque", "Figtree", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-tekst: "Figtree", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-groot: 20px; --r: 14px; --r-klein: 10px;
  --schaduw: 0 1px 2px rgba(13,16,33,.04), 0 6px 24px -12px rgba(13,16,33,.12);
}
* { box-sizing: border-box; }
body { background: var(--grond); color: var(--inkt); font: 15.5px/1.55 var(--f-tekst); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: rgba(243,245,249,.92); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.kolom { max-width: 920px; margin: 0 auto; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent-donker); }

/* Balk */
.balk { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(243,245,249,.86); -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px); border-bottom: 1px solid rgba(13,16,33,.06); }
.balk .kolom { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.merk { font: 800 22px/1 var(--f-kop); letter-spacing: -.03em; margin-right: auto; color: var(--inkt); text-decoration: none; }
.merk i { font-style: normal; color: var(--accent); }
.nav { display: flex; gap: 2px; background: #e7eaf2; padding: 3px; border-radius: 999px; }
.nav a { color: var(--inkt-2); text-decoration: none; font-weight: 600; font-size: 14px; padding: 6px 14px; border-radius: 999px; }
.nav a[aria-current="page"] { background: var(--nacht); color: #fff; }

main { padding-block: 24px 56px; }
h1 { font: 800 clamp(28px, 6vw, 38px)/1.05 var(--f-kop); letter-spacing: -.035em; margin: 0 0 6px; text-wrap: balance; }
.sub { color: var(--inkt-3); font-size: 14px; margin: 0 0 20px; }
.eyebrow { font: 600 11.5px/1 var(--f-data); letter-spacing: .08em; text-transform: uppercase; color: var(--inkt-3); }

/* Lijst rapporten */
.lijst { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); }
.kaart { background: var(--vlak); border: 1px solid var(--rand); border-radius: var(--r-groot); padding: 18px; box-shadow: var(--schaduw); }
a.kaart { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; color: inherit; text-decoration: none; transition: transform .15s ease, border-color .15s ease; }
a.kaart:hover { border-color: #c9d0ff; transform: translateY(-1px); }
.k-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
.k-ticker { font: 500 12px/1 var(--f-data); background: var(--grond); border: 1px solid var(--rand); padding: 4px 7px; border-radius: 6px; color: var(--inkt-2); }
.k-naam { font: 700 22px/1.15 var(--f-kop); letter-spacing: -.02em; min-width: 0; margin-top: 6px; }
.k-meta { color: var(--inkt-3); font-size: 13px; }
.k-score { grid-row: 1 / span 3; grid-column: 2; text-align: right; align-self: start; }
.k-score b { font: 800 44px/0.9 var(--f-kop); letter-spacing: -.04em; display: block; }
.k-score small { font: 500 12px var(--f-data); color: var(--inkt-3); }
.k-reden { grid-column: 1 / -1; font-size: 14.5px; color: var(--inkt-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 8px; }
.k-onder { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.oordeel { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px 4px 8px; font-weight: 700; font-size: 13px; line-height: 1.2; }
.oordeel::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.oordeel small { font-weight: 500; opacity: .8; }
.oordeel.Kopen { background: var(--kopen-z); color: var(--kopen); } .oordeel.Houden { background: var(--houden-z); color: var(--houden); }
.oordeel.Verkopen { background: var(--verkopen-z); color: var(--verkopen); } .oordeel.Afwachten { background: var(--afwachten-z); color: #9a6200; }
.oordeel.Onvoldoende { background: var(--onvoldoende-z); color: var(--inkt-2); }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--grond); color: var(--inkt-2); }
.chip.nogo { background: var(--verkopen-z); color: #c4262b; }
.chip.hoog { background: #fff0e6; color: #c24a07; }
.chip.middel { background: var(--afwachten-z); color: #9a6200; }
.chip.def { background: var(--kopen-z); color: #08744f; }
.leeg { text-align: center; color: var(--inkt-2); padding: 36px 18px; }
.leeg code { font-family: var(--f-data); background: var(--grond); padding: 2px 6px; border-radius: 6px; }

/* Rapportweergave */
.rbalk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 14px; }
.terug { color: var(--inkt-2); text-decoration: none; font-weight: 600; margin-right: auto; font-size: 14.5px; }
.terug:hover { color: var(--inkt); }
.knop { border: 1px solid var(--rand); background: var(--vlak); color: var(--inkt); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; }
.knop:hover { border-color: #c9d0ff; }
.knop.hoofd { background: var(--accent); border-color: var(--accent); color: #fff; }
.knop:disabled { opacity: .5; cursor: default; }
.status { font-size: 13px; color: var(--inkt-3); min-height: 1.2em; }
.status.fout { color: var(--verkopen); }
#rapport-host { display: block; min-width: 0; }

/* Vraagbalk boven het rapport */
.vraagblok { margin-bottom: 18px; }
.invoer { display: flex; align-items: flex-end; gap: 6px; background: var(--vlak); border: 1.5px solid var(--rand); border-radius: 26px; padding: 6px 6px 6px 16px; box-shadow: var(--schaduw); transition: border-color .15s ease, box-shadow .15s ease; }
.invoer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(59,91,255,.12), var(--schaduw); }
.invoer .ico { flex: none; width: 18px; height: 18px; color: var(--accent); align-self: center; }
.invoer textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; padding: 9px 4px; min-height: 40px; max-height: 160px; font-size: 15.5px; }
.invoer textarea:focus-visible { outline: 0; }
.invoer .stuur { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--nacht); color: #fff; display: grid; place-items: center; cursor: pointer; }
.invoer .stuur:disabled { opacity: .35; cursor: default; }
.invoer .stuur svg { width: 18px; height: 18px; }
.vraagblok .status:empty { display: none; }
.vraagblok .status { margin: 8px 6px 0; }
.voorbeelden { display: flex; gap: 6px; overflow-x: auto; padding: 10px 2px 2px; scrollbar-width: none; }
.voorbeelden::-webkit-scrollbar { display: none; }
.voorbeelden:empty { display: none; }
.voorbeelden button { flex: none; white-space: nowrap; border: 1px solid var(--rand); background: var(--vlak); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; color: var(--inkt-2); }
.voorbeelden button:hover { border-color: #c9d0ff; color: var(--inkt); }
.chat { display: grid; gap: 12px; }
.chat:not(:empty) { margin-top: 12px; }
.paar { display: grid; gap: 8px; }
.bericht { padding: 10px 14px; border-radius: 18px; max-width: 92%; overflow-wrap: anywhere; }
.bericht.jij { background: var(--nacht); color: #fff; justify-self: end; border-bottom-right-radius: 6px; }
.bericht.claude { background: var(--vlak); border: 1px solid var(--rand); justify-self: start; border-bottom-left-radius: 6px; }
.bericht.claude p { margin: 0 0 8px; } .bericht.claude p:last-child { margin: 0; }
.bericht.claude ul { margin: 4px 0 8px; padding-left: 20px; }
details.eerder { margin: 10px 4px 0; font-size: 13.5px; }
details.eerder summary { color: var(--accent-donker); cursor: pointer; font-weight: 600; }
details.eerder .paar { margin-top: 10px; }
details.eerder .knop { margin-top: 10px; font-size: 13px; }
.uitleg { font-size: 13px; color: var(--inkt-3); }

/* Vergelijken + profiel */
.tabelwrap { overflow-x: auto; background: var(--vlak); border: 1px solid var(--rand); border-radius: var(--r-groot); box-shadow: var(--schaduw); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 10px 14px; border-bottom: 1px solid var(--rand); text-align: left; vertical-align: top; }
tr:last-child th, tr:last-child td { border-bottom: 0; }
th { font: 600 11.5px var(--f-data); letter-spacing: .05em; text-transform: uppercase; color: var(--inkt-3); white-space: nowrap; }
td.n { font-family: var(--f-data); white-space: nowrap; }
.md { background: var(--vlak); border: 1px solid var(--rand); border-radius: var(--r-groot); padding: 6px 20px 16px; overflow-wrap: anywhere; min-width: 0; box-shadow: var(--schaduw); }
.md h1 { font-size: 24px; margin-top: 16px; } .md h2 { font: 700 18px var(--f-kop); letter-spacing: -.01em; margin-top: 24px; } .md h3 { font-size: 15px; }
.md table { font-size: 13.5px; } .md .tw { overflow-x: auto; }
.md blockquote { margin: 10px 0; padding: 10px 14px; background: var(--accent-zacht); border-radius: var(--r-klein); color: var(--inkt-2); }
.md code { font-family: var(--f-data); font-size: 12.5px; }
.sectiekop { font: 700 19px var(--f-kop); letter-spacing: -.015em; margin: 28px 0 10px; }
.fbl { display: grid; gap: 10px; }
.fbl .kaart { font-size: 14px; }
/* Prijsbalk (startpagina + positie) */
.pb { grid-column: 1 / -1; margin-top: 12px; }
.pb-spoor { position: relative; height: 10px; border-radius: 5px; background: var(--rand); margin: 16px 0 12px; }
.pb-zone { position: absolute; top: 0; bottom: 0; background: var(--kopen); opacity: .5; border-radius: 3px; }
.pb-s { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px; border-radius: 2px; }
.pb-s.stop, .pk.stop { background: var(--verkopen); } .pb-s.doel, .pk.doel { background: var(--houden); } .pb-s.koop, .pk.koop { background: #8a5cf6; }
.pb-nu { position: absolute; top: -5px; width: 12px; height: 20px; margin-left: -6px; border-radius: 4px; background: var(--inkt); border: 2px solid var(--vlak); }
.pb-b { position: absolute; top: 14px; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%; background: var(--inkt-3); }
.pb-b.Slecht { background: var(--verkopen); } .pb-b.Normaal { background: var(--houden); } .pb-b.Goed { background: var(--kopen); }
.pb-leg { display: flex; flex-wrap: wrap; gap: 3px 12px; font-size: 12px; color: var(--inkt-2); }
.pb-leg span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.pk { display: inline-block; width: 4px; height: 12px; border-radius: 2px; flex: none; }
.pk.nu { width: 9px; background: var(--inkt); border-radius: 3px; } .pk.zone { width: 11px; background: var(--kopen); opacity: .5; }
.k-eigen { grid-column: 1 / -1; display: grid; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--rand); font-size: 13.5px; color: var(--inkt-2); }
.k-eigen:empty { display: none; }
.k-eigen b { color: var(--inkt); }
.plus { color: #08744f; font-weight: 700; } .min { color: #c4262b; font-weight: 700; }
.chip.oud { background: var(--afwachten-z); color: #9a6200; }
.tip { margin-top: 18px; font-size: 13.5px; color: var(--inkt-3); }
.tip code { font-family: var(--f-data); background: #e7eaf2; padding: 2px 6px; border-radius: 6px; color: var(--inkt-2); }

/* Jouw positie + opvolgen */
details.blok { background: var(--vlak); border: 1px solid var(--rand); border-radius: var(--r-groot); box-shadow: var(--schaduw); margin-bottom: 12px; }
details.blok > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px 18px; font: 700 17px var(--f-kop); letter-spacing: -.015em; }
details.blok > summary::-webkit-details-marker { display: none; }
details.blok > summary small { font: 500 13px var(--f-tekst); color: var(--inkt-3); letter-spacing: 0; margin-left: auto; text-align: right; }
details.blok > summary::after { content: "+"; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--grond); color: var(--accent-donker); display: grid; place-items: center; font: 500 18px/1 var(--f-tekst); }
details.blok[open] > summary::after { content: "–"; }
.blok-in { padding: 0 18px 18px; display: grid; gap: 14px; }
.blok-in p { margin: 0; }
.velden { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.veld label { display: block; font-size: 12.5px; font-weight: 600; color: var(--inkt-2); margin-bottom: 4px; }
.veld input { width: 100%; border: 1.5px solid var(--rand); border-radius: 12px; padding: 9px 12px; font: 600 16px var(--f-data); background: var(--vlak); }
.veld input:focus { border-color: var(--accent); outline: 0; }
.veld small { display: block; font-size: 11.5px; color: var(--inkt-3); margin-top: 3px; }
.knoprij { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tegels { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tgl { border: 1px solid var(--rand); border-radius: var(--r); padding: 10px 12px; }
.tgl .n { font-size: 12px; color: var(--inkt-3); } .tgl .w { font: 700 21px var(--f-kop); letter-spacing: -.02em; } .tgl .t { font-size: 12.5px; color: var(--inkt-2); }
.watnu { border-radius: var(--r); padding: 14px 16px; background: var(--accent-zacht); }
.watnu.rood { background: var(--verkopen-z); } .watnu.geel { background: var(--afwachten-z); } .watnu.groen { background: var(--kopen-z); }
.watnu h3 { margin: 0 0 6px; font: 700 18px var(--f-kop); letter-spacing: -.015em; }
.watnu ul { margin: 6px 0 0; padding-left: 20px; } .watnu li { margin: 4px 0; }
.watnu .klein, .klein { font-size: 12.5px; color: var(--inkt-3); }
.subkop { font: 700 15px var(--f-kop); margin: 0; }
.sctab { width: 100%; font-size: 14px; } .sctab td, .sctab th { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--rand); }
.sctab td:not(:first-child) { text-align: right; font-family: var(--f-data); white-space: nowrap; }
.signalen { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.signalen li { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rand); align-items: start; }
.signalen input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--verkopen); }
.signalen em, .agenda em { display: block; font-style: normal; font-size: 12.5px; color: var(--inkt-3); }
.signalen li.aan { color: #c4262b; font-weight: 600; }
.agenda { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14.5px; }
.agenda li { padding-left: 12px; border-left: 3px solid var(--accent); } .agenda li.voorbij { border-color: var(--rand); color: var(--inkt-3); }

/* Navigatie binnen een rapport */
.rnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 60px); z-index: 4; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 8px 0; margin: 0 0 6px; background: rgba(243,245,249,.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.rnav::-webkit-scrollbar { display: none; }
.rnav:empty { display: none; }
.rnav button { flex: none; border: 1px solid var(--rand); background: var(--vlak); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; color: var(--inkt-2); cursor: pointer; }
.omhoog { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 6; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--nacht); color: #fff; font-size: 20px; cursor: pointer; box-shadow: var(--schaduw); }
.omhoog[hidden] { display: none; }

/* Bedrijfspagina */
.kaart.stand { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; margin-bottom: 14px; }
.kaart.stand h1.k-naam { font-size: clamp(26px, 6vw, 34px); margin: 6px 0 0; }
.stand-reden { grid-column: 1 / -1; font-size: 15px; color: var(--inkt-2); margin-top: 8px; }
.tijdlijn { list-style: none; margin: 0 0 16px 6px; padding: 0 0 0 18px; border-left: 2px solid var(--rand); display: grid; gap: 18px; }
.tijdlijn li { position: relative; display: grid; gap: 8px; justify-items: start; }
.tijdlijn li::before { content: ""; position: absolute; left: -25px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--grond); }
.tijdlijn li + li::before { background: var(--inkt-3); }
.tl-kop { font-size: 14px; color: var(--inkt-2); } .tl-kop strong { color: var(--inkt); }
.tl-kern { font-size: 14.5px; }
.tijdlijn .k-onder { margin-top: 0; } .tijdlijn .chip { background: #e7eaf2; font-weight: 500; }
.oudmelding { background: var(--afwachten-z); color: #6d4500; border-radius: var(--r-klein); padding: 10px 14px; font-size: 14px; margin: 0 0 12px; }

/* Vergelijken */
.vgl { display: grid; gap: 10px; }
.vgl .kaart { padding: 14px 18px; }
.vgl .lab { font: 600 11.5px var(--f-data); letter-spacing: .05em; text-transform: uppercase; color: var(--inkt-3); display: flex; justify-content: space-between; gap: 8px; }
.vgl .nu { font: 700 19px var(--f-kop); letter-spacing: -.015em; margin: 4px 0 2px; }
.vgl .nu.tekst { font: 400 15px/1.5 var(--f-tekst); letter-spacing: 0; }
.vgl .was { font-size: 13.5px; color: var(--inkt-2); margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--rand); }
.vgl .gelijk { font-size: 13px; color: var(--inkt-3); }
.vgl .gew { color: #9a6200; }

@media (max-width: 560px) {
  .k-score b { font-size: 38px; }
  .nav a { padding: 6px 12px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>

<header class="balk gutter">
  <div class="kolom">
    <a class="merk" href="#rapporten">invest<i>.</i></a>
    <nav class="nav" aria-label="Hoofdmenu">
      <a href="#rapporten" id="nav-rapporten">Rapporten</a>
      <a href="#profiel" id="nav-profiel">Profiel</a>
    </nav>
  </div>
</header>

<main class="gutter"><div class="kolom" id="inhoud">
  <p class="sub">Rapporten laden…</p>
</div></main>

<script>
(() => {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const vet = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+?)\*/g, "<em>$1</em>").replace(/\[\[(.+?)\|(.+?)\]\]/g, "$1");
  const tkSlug = t => String(t).replace(/[^A-Za-z0-9-]/g, "-");
  const vandaag = () => new Date().toISOString().slice(0, 10);
  const dagenSinds = d => Math.round((new Date(vandaag()) - new Date(String(d).slice(0, 10))) / 864e5);
  const geleden = n => n <= 0 ? "vandaag" : n === 1 ? "gisteren" : n + " dagen geleden";
  const num = t => { const v = parseFloat(String(t ?? "").replace(/\s/g, "").replace(",", ".")); return Number.isFinite(v) && v > 0 ? v : null; };
  const pct = (a, b) => { if (!a || !b) return ""; const d = (a / b - 1) * 100; return (d >= 0 ? "+" : "−") + Math.abs(d).toLocaleString("nl-BE", { maximumFractionDigits: 1 }) + "%"; };
  const kleur = (a, b) => a >= b ? "plus" : "min";
  // Datum uit een agendapunt ("**Rond 19-11-2026 — …**") → "2026-11-19"
  const agendaDatum = t => { const m = /(\d{1,2})-(\d{1,2})-(\d{4})/.exec(t || ""); return m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : null; };
  const getal = (v, e = "") => v == null ? "–" : (Number.isInteger(v) ? v.toLocaleString("nl-BE") : v.toLocaleString("nl-BE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })) + (e ? " " + e : "");
  const datum = d => { try { return new Date(d + "T12:00:00").toLocaleDateString("nl-BE", { day: "numeric", month: "long", year: "numeric" }); } catch { return d; } };
  const opslag = {
    lees(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
    schrijf(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const ERNST = { nogo: "No-go", hoog: "Hoog", middel: "Middel", info: "Info" };

  let manifest = null;
  const cap = {};
  const kanUse = window.claude && typeof window.claude.use === "function";
  for (const n of ["sample", "db", "downloads"]) cap[n] = kanUse ? window.claude.use(n).catch(() => null) : Promise.resolve(null);

  // Bewaarde gegevens van de gebruiker (positie, opvolging, vragen): in de app-database, met een lokale kopie.
  async function bewaard(pad, std = {}) {
    const lokaal = opslag.lees("db:" + pad, null);
    const db = await cap.db;
    if (!db) return lokaal ?? std;
    try { const d = await db.doc(pad).get(); if (d.exists) { opslag.schrijf("db:" + pad, d.data()); return d.data(); } } catch {}
    return lokaal ?? std;
  }
  async function bewaar(pad, data) {
    opslag.schrijf("db:" + pad, data);
    const db = await cap.db;
    if (db) await db.doc(pad).set(data);
  }

  // Alle prijzen op één lijn. pos = eigen positie (optioneel): dan eigen aankoopprijs en eigen stop-loss.
  function prijsbalk(i, pos) {
    const nu = pos?.koers || i.koers_nu, stop = pos?.aankoop ? pos.aankoop * 0.8 : i.stop_loss;
    const w = [nu, stop, i.koersdoel, i.koopzone?.van, i.koopzone?.tot, pos?.aankoop, ...(i.scenarios || []).map(x => x.koers)].filter(x => typeof x === "number");
    if (!nu || w.length < 3) return "";
    let lo = Math.min(...w), hi = Math.max(...w); const m = (hi - lo) * 0.06 || 1; lo -= m; hi += m;
    const p = x => ((x - lo) / (hi - lo) * 100).toFixed(1);
    const v = i.valuta || "";
    return `<div class="pb"><div class="pb-spoor">
        ${i.koopzone ? `<i class="pb-zone" style="left:${p(i.koopzone.van)}%;width:${(p(i.koopzone.tot) - p(i.koopzone.van)).toFixed(1)}%"></i>` : ""}
        ${stop ? `<i class="pb-s stop" style="left:${p(stop)}%"></i>` : ""}
        ${i.koersdoel ? `<i class="pb-s doel" style="left:${p(i.koersdoel)}%"></i>` : ""}
        ${pos?.aankoop ? `<i class="pb-s koop" style="left:${p(pos.aankoop)}%"></i>` : ""}
        ${(i.scenarios || []).map(x => `<i class="pb-b ${esc(x.naam)}" style="left:${p(x.koers)}%"></i>`).join("")}
        <i class="pb-nu" style="left:${p(nu)}%"></i></div>
      <div class="pb-leg">
        ${stop ? `<span><i class="pk stop"></i>${pos?.aankoop ? "jouw stop-loss" : "stop-loss"} ${getal(Math.round(stop * 100) / 100)}</span>` : ""}
        ${i.koopzone ? `<span><i class="pk zone"></i>koopzone ${getal(i.koopzone.van)}–${getal(i.koopzone.tot)}</span>` : ""}
        ${pos?.aankoop ? `<span><i class="pk koop"></i>jouw aankoop ${getal(pos.aankoop)}</span>` : ""}
        <span><i class="pk nu"></i>koers ${getal(nu, v)}</span>
        ${i.koersdoel ? `<span><i class="pk doel"></i>koersdoel ${getal(i.koersdoel)}</span>` : ""}
      </div></div>`;
  }

  async function laadManifest() {
    if (manifest) return manifest;
    const r = await fetch("manifest.json", { cache: "no-store" });
    if (!r.ok) throw new Error("manifest " + r.status);
    manifest = await r.json();
    return manifest;
  }

  function zetNav(naam) {
    for (const id of ["rapporten", "profiel"]) {
      const a = $("#nav-" + id);
      if (id === naam) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    }
  }

  // ------------------------------------------------------------ overzicht
  function oordeelHtml(i) {
    const k = (i.oordeel || "").split(" ")[0];
    return `<span class="oordeel ${esc(k)}">${esc(i.oordeel)}</span>`;
  }
  async function toonOverzicht() {
    zetNav("rapporten");
    const el = $("#inhoud");
    let m;
    try { m = await laadManifest(); } catch (e) { el.innerHTML = `<p class="status fout">De rapportenlijst kon niet geladen worden. Herlaad de pagina.</p>`; return; }
    const perTicker = {};
    for (const r of m.rapporten) (perTicker[r.ticker] ||= []).push(r);
    const groepen = Object.values(perTicker).map(l => l.sort((a, b) => b.datum.localeCompare(a.datum)));
    groepen.sort((a, b) => b[0].datum.localeCompare(a[0].datum));
    if (!groepen.length) {
      el.innerHTML = `<h1>Rapporten</h1><div class="kaart leeg">Nog geen rapporten. Start in Claude Code een sessie in het Invest-project en typ <code>analyseer &lt;naam of ticker&gt;</code>.</div>`;
      return;
    }
    el.innerHTML = `<div class="eyebrow">Onderzoek op vraag</div><h1>Rapporten</h1><p class="sub">${groepen.length} bedrijf${groepen.length === 1 ? "" : "en"} · ${m.rapporten.length} rapport${m.rapporten.length === 1 ? "" : "en"} · nieuwste eerst</p><div class="lijst">` +
      groepen.map(l => {
        const i = l[0];
        const vlaggen = i.rode_vlaggen.filter(v => v.ernst !== "info");
        return `<a class="kaart" href="#b-${esc(tkSlug(i.ticker))}">
          <div class="k-top"><span class="k-ticker">${esc(i.ticker)}</span>${oordeelHtml(i)}</div>
          <div class="k-score" aria-label="score ${i.score ?? "–"} op 10"><b>${i.score ?? "–"}</b><small>/10</small></div>
          <div class="k-naam">${esc(i.naam)}</div>
          <div class="k-meta">${i.soort === "snelle_update" ? "Snelle update · " : ""}${datum(i.datum)} (${geleden(dagenSinds(i.datum))})${i.sector ? " · " + esc(i.sector) : ""}${l.length > 1 ? ` · ${l.length - 1} eerder rapport${l.length > 2 ? "en" : ""}` : ""}</div>
          <div class="k-reden">${vet(i.reden)}</div>
          ${prijsbalk(i)}
          <div class="k-eigen" data-id="${esc(i.id)}"></div>
          <div class="k-onder">${i.defensief ? `<span class="chip def">Defensief</span>` : ""}${vlaggen.map(v => `<span class="chip ${esc(v.ernst)}">${esc(ERNST[v.ernst] || v.ernst)}${v.regel ? " · " + esc(v.regel) : ""}</span>`).join("")}${!vlaggen.length ? `<span class="chip">Geen rode vlaggen</span>` : ""}${dagenSinds(i.datum) > 90 ? `<span class="chip oud">Meer dan 3 maanden oud: vraag een update</span>` : ""}</div>
        </a>`;
      }).join("") + `</div><p class="tip">Nieuwe analyse of update? Typ in Claude Code <code>analyseer &lt;naam&gt;</code> of <code>update &lt;naam&gt;</code>. De app zoekt niets uit zichzelf op: koersen zijn die van de rapportdatum.</p>`;
    // Eigen gegevens per bedrijf: positie, laatst nagekeken, volgende datum.
    for (const l of groepen) {
      const i = l[0], el2 = el.querySelector(`.k-eigen[data-id="${CSS.escape(i.id)}"]`);
      Promise.all([bewaard("posities/" + tkSlug(i.ticker)), bewaard("opvolging/" + i.id)]).then(([pos, opv]) => {
        const regels = [];
        if (pos.aankoop) {
          const nu = pos.koers || i.koers_nu, stop = pos.aankoop * 0.8;
          regels.push(`<span><b>Je bezit dit.</b> Resultaat <span class="${kleur(nu, pos.aankoop)}">${pct(nu, pos.aankoop)}</span> · jouw stop-loss ${getal(Math.round(stop * 100) / 100, i.valuta)}${nu <= stop ? ` · <span class="min">geraakt</span>` : ""}</span>`);
        }
        const geraakt = Object.values(opv.geraakt || {}).filter(Boolean).length;
        if (geraakt) regels.push(`<span class="min">${geraakt} verkoopsignaal${geraakt > 1 ? "en" : ""} aangevinkt</span>`);
        const komend = (i.agenda || []).map(t => [agendaDatum(t), t]).filter(([d]) => d && d >= vandaag()).sort()[0];
        if (komend) regels.push(`<span>Volgende datum: ${vet((/\*\*(.+?)\*\*/.exec(komend[1]) || [0, komend[1]])[1])}</span>`);
        regels.push(`<span>${opv.nagekeken ? "Verkoopsignalen laatst nagekeken: " + geleden(dagenSinds(opv.nagekeken)) : "Verkoopsignalen nog niet nagekeken"}</span>`);
        if (el2) el2.innerHTML = regels.join("");
      });
    }
  }

  // ------------------------------------------------------------ rapport
  let actief = null;
  async function toonRapport(id, tab) {
    zetNav("rapporten");
    const el = $("#inhoud");
    let m;
    try { m = await laadManifest(); } catch { el.innerHTML = `<p class="status fout">Kon de rapportenlijst niet laden.</p>`; return; }
    const r = m.rapporten.find(x => x.id === id);
    if (!r) { el.innerHTML = `<p class="status fout">Dit rapport bestaat niet (meer). <a href="#rapporten">Terug naar de lijst</a>.</p>`; return; }
    const zelfde = m.rapporten.filter(x => x.ticker === r.ticker).sort((a, b) => b.datum.localeCompare(a.datum));
    const nieuwste = zelfde[0];
    actief = r;
    el.innerHTML = `
      <div class="rbalk">
        <a class="terug" href="#b-${esc(tkSlug(r.ticker))}">← ${esc(r.naam)}</a>
        <button class="knop" id="pdf" type="button" ${r.pdf ? "" : "disabled"}>PDF downloaden</button>
      </div>
      <div class="status" id="pdf-status" role="status"></div>
      <section id="p-vragen" class="vraagblok" aria-label="Vragen over dit rapport"></section>
      ${nieuwste.id !== r.id ? `<p class="oudmelding">Dit is een ouder rapport. Het nieuwste is van <a href="#r-${esc(nieuwste.id)}">${datum(nieuwste.datum)}</a>.</p>` : ""}
      <nav class="rnav" id="rnav" aria-label="Delen van het rapport"></nav>
      <button class="omhoog" id="omhoog" type="button" aria-label="Naar boven" hidden>↑</button>
      <section id="p-rapport"><div id="rapport-host"></div><p class="status" id="r-status">Rapport laden…</p></section>`;
    $("#pdf").addEventListener("click", () => downloadPdf(r));
    bouwVragen(r);
    laadRapportHtml(r);
    const om = $("#omhoog");
    om.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    window.onscroll = () => { const k = $("#omhoog"); if (k) k.hidden = window.scrollY < 900; };
  }

  // ------------------------------------------------------------ jouw positie + opvolgen
  const eigen = {};   // per ticker: laatst gekende positie (ook voor vragen aan Claude)
  function watNu(r, pos, nu, geraakt) {
    const stop = pos.aankoop * 0.8, v = r.valuta || "", nogo = (r.rode_vlaggen || []).find(x => x.ernst === "nogo");
    const o = (r.oordeel || "").split(" ")[0], kz = r.koopzone, pt = [];
    let kop, kl = "";
    if (nu <= stop) { kop = "Je stop-loss is geraakt"; kl = "rood";
      pt.push(`De koers (${getal(nu, v)}) staat op of onder jouw stop-loss van ${getal(Math.round(stop * 100) / 100, v)} (20% onder je aankoopprijs). Volgens je eigen regel is dit het moment om te verkopen en het verlies te beperken.`);
    } else if (geraakt.length) { kop = "Een verkoopsignaal is geraakt"; kl = "rood";
      pt.push(`Je vinkte ${geraakt.length} verkoopsignaal${geraakt.length > 1 ? "en" : ""} aan. Dat betekent dat de reden om dit aandeel te houden mogelijk niet meer klopt. Overweeg te verkopen, of vraag eerst een update van het rapport.`);
    } else if (o === "Verkopen") { kop = "Het rapport zegt: verkopen"; kl = "rood";
      pt.push("Het oordeel van het rapport is Verkopen. Dat geldt ook voor wie het aandeel al bezit.");
    } else if (r.koersdoel && nu >= r.koersdoel) { kop = "Koersdoel bereikt: winst nemen overwegen"; kl = "geel";
      pt.push(`De koers (${getal(nu, v)}) staat op of boven het koersdoel van ${getal(r.koersdoel, v)}. Het normale scenario verwacht geen verdere stijging meer. "Koersdoel bereikt" is één van je eigen redenen om te verkopen.`);
    } else if (o === "Kopen") { kop = "Houden"; kl = "groen";
      pt.push("Het rapport is positief. Er is geen reden om te verkopen zolang je stop-loss en de verkoopsignalen niet geraakt zijn.");
      if (kz) pt.push(nu <= kz.tot ? `De koers zit in of onder de koopzone (${getal(kz.van)}–${getal(kz.tot, v)}): bijkopen kan volgens het rapport.` : `Bijkopen doe je volgens het rapport liefst pas in de koopzone (${getal(kz.van)}–${getal(kz.tot, v)}).`);
    } else if (o === "Houden") { kop = "Houden, niet bijkopen"; kl = "";
      pt.push("Het rapport zegt Houden: geen reden om te verkopen zolang je stop-loss en de verkoopsignalen niet geraakt zijn, maar ook geen reden om nu bij te kopen.");
      if (kz && nu > kz.tot) pt.push(`Bijkopen wordt pas interessant in de koopzone (${getal(kz.van)}–${getal(kz.tot, v)}).`);
    } else { kop = "Houden en opvolgen, niet bijkopen"; kl = "geel";
      pt.push(`Het rapport zegt ${esc(r.oordeel || "Afwachten")}: nu niet (bij)kopen. Voor aandelen die je al hebt, is er geen verkoopsignaal geraakt en staat de koers boven je stop-loss. Houden kan dus, zolang je de verkoopsignalen opvolgt.`);
      if (kz) pt.push(nu <= kz.tot ? `De koers zit in de koopzone (${getal(kz.van)}–${getal(kz.tot, v)}), maar het oordeel is geen koopadvies: lees eerst waarom.` : `Bijkopen zou pas in de koopzone (${getal(kz.van)}–${getal(kz.tot, v)}) te overwegen zijn.`);
    }
    if (nogo) pt.push(`Let op: dit aandeel raakt je harde regel ${esc(nogo.regel || "")} (${esc(nogo.titel)}). Volgens je profiel zou je het normaal niet kopen. Beslis bewust of je het wil aanhouden.`);
    if (nu > stop) pt.push(`Jouw stop-loss ligt op ${getal(Math.round(stop * 100) / 100, v)}: de koers mag nog ${Math.abs((stop / nu - 1) * 100).toLocaleString("nl-BE", { maximumFractionDigits: 0 })}% zakken voor hij geraakt wordt.`);
    return { kop, kl, pt };
  }
  async function bouwEigen(r) {
    const host = $("#p-eigen"), tk = tkSlug(r.ticker), v = r.valuta || "";
    let [pos, opv] = await Promise.all([bewaard("posities/" + tk), bewaard("opvolging/" + r.id)]);
    opv.geraakt ||= {};
    const teken = (openPos, openOpv) => {
      if (actief !== r || !host.isConnected) return;
      eigen[r.ticker] = pos;
      const heeft = !!pos.aankoop, nu = pos.koers || r.koers_nu, eigenKoers = !!pos.koers;
      const geraakt = (r.verkoopsignalen || []).filter((_, n) => opv.geraakt[n]);
      let res = "";
      if (heeft) {
        const stop = pos.aankoop * 0.8, w = watNu(r, pos, nu, geraakt), a = pos.aantal || 0;
        const bedrag = x => a ? ` · ${x >= 0 ? "+" : "−"}${getal(Math.round(Math.abs(x)), v)}` : "";
        res = `
          <div class="watnu ${w.kl}"><h3>${w.kop}</h3><ul>${w.pt.map(x => `<li>${x}</li>`).join("")}</ul>
            <p class="klein" style="margin-top:8px">Dit voorstel volgt automatisch uit het rapport van ${datum(r.datum)}, jouw aankoopprijs en je regel van −20%. Het is geen nieuw onderzoek en geen gereglementeerd advies. ${eigenKoers ? `Gerekend met jouw koers van ${pos.koers_datum ? datum(pos.koers_datum) : "vandaag"}.` : `Gerekend met de koers van het rapport (${esc(r.koers_datum || r.datum)}): vul hierboven de koers van vandaag in voor een juist beeld.`}</p></div>
          <div class="tegels">
            <div class="tgl"><div class="n">Jouw resultaat</div><div class="w ${kleur(nu, pos.aankoop)}">${pct(nu, pos.aankoop)}</div><div class="t">${getal(pos.aankoop)} → ${getal(nu, v)}${a ? bedrag((nu - pos.aankoop) * a) : ""}</div></div>
            <div class="tgl"><div class="n">Jouw stop-loss</div><div class="w">${getal(Math.round(stop * 100) / 100, v)}</div><div class="t">20% onder je aankoopprijs${nu <= stop ? ` · <span class="min">geraakt</span>` : ` · ${pct(stop, nu)} vanaf nu`}</div></div>
            ${r.koersdoel ? `<div class="tgl"><div class="n">Tot het koersdoel</div><div class="w">${pct(r.koersdoel, nu)}</div><div class="t">koersdoel ${getal(r.koersdoel, v)} · ${pct(r.koersdoel, pos.aankoop)} t.o.v. je aankoop</div></div>` : ""}
            ${a ? `<div class="tgl"><div class="n">Waarde nu</div><div class="w">${getal(Math.round(nu * a), v)}</div><div class="t">${getal(a)} aandelen · inleg ${getal(Math.round(pos.aankoop * a), v)}</div></div>` : ""}
          </div>
          ${prijsbalk(r, { ...pos, koers: nu })}
          ${(r.scenarios || []).length ? `<div><h3 class="subkop">De drie scenario's voor jouw aandelen</h3>
            <table class="sctab"><tbody>${r.scenarios.map(x => `<tr><td><strong>${esc(x.naam)}</strong>${x.kans ? ` <span class="klein">kans ${esc(x.kans)}</span>` : ""}</td><td>${getal(x.koers, v)}</td><td class="${kleur(x.koers, pos.aankoop)}">${pct(x.koers, pos.aankoop)}${a ? bedrag((x.koers - pos.aankoop) * a) : ""}</td></tr>`).join("")}</tbody></table>
            <p class="klein">Koers over twee jaar volgens het rapport, vergeleken met jouw aankoopprijs (zonder dividend, kosten en belasting).</p></div>` : ""}
          <div class="knoprij"><button class="knop hoofd" type="button" id="pos-vraag">Vraag Claude wat ik best doe</button></div>`;
      }
      host.innerHTML = `
        <details class="blok" id="b-pos" ${openPos ?? heeft ? "open" : ""}>
          <summary>Jouw positie<small>${heeft ? `gekocht aan ${getal(pos.aankoop, v)} · <span class="${kleur(nu, pos.aankoop)}">${pct(nu, pos.aankoop)}</span>` : "Bezit je dit? Vul je aankoopprijs in"}</small></summary>
          <div class="blok-in">
            <p class="klein">Het rapport rekent voor iemand die nu zou kopen. Vul je eigen aankoopprijs in en je krijgt hier dezelfde cijfers voor jouw aandelen, met een voorstel wat je ermee kan doen.</p>
            <form class="velden" id="pos-form">
              <div class="veld"><label for="pos-aankoop">Aankoopprijs per aandeel (${esc(v)})</label><input id="pos-aankoop" inputmode="decimal" autocomplete="off" value="${pos.aankoop ? String(pos.aankoop).replace(".", ",") : ""}"><small>gemiddelde prijs als je in stukken kocht</small></div>
              <div class="veld"><label for="pos-aantal">Aantal aandelen</label><input id="pos-aantal" inputmode="decimal" autocomplete="off" value="${pos.aantal ? String(pos.aantal).replace(".", ",") : ""}"><small>mag leeg blijven</small></div>
              <div class="veld"><label for="pos-koers">Koers vandaag (${esc(v)})</label><input id="pos-koers" inputmode="decimal" autocomplete="off" value="${pos.koers ? String(pos.koers).replace(".", ",") : ""}" placeholder="${getal(r.koers_nu)}"><small>leeg = koers van het rapport (${esc(r.koers_datum || r.datum)})</small></div>
              <div class="knoprij" style="grid-column:1/-1"><button class="knop hoofd" type="submit">${heeft ? "Herberekenen" : "Bereken voor mijn aandelen"}</button>${heeft ? `<button class="knop" type="button" id="pos-wis">Ik bezit dit niet meer</button>` : ""}<span class="status" id="pos-status" role="status"></span></div>
            </form>
            ${res}
          </div>
        </details>
        ${(r.verkoopsignalen || []).length || (r.agenda || []).length ? `
        <details class="blok" id="b-opv" ${openOpv ? "open" : ""}>
          <summary>Opvolgen<small>${geraakt.length ? `<span class="min">${geraakt.length} signaal${geraakt.length > 1 ? "en" : ""} geraakt</span>` : opv.nagekeken ? "nagekeken " + geleden(dagenSinds(opv.nagekeken)) : "nog niet nagekeken"}</small></summary>
          <div class="blok-in">
            ${(r.verkoopsignalen || []).length ? `<div><h3 class="subkop">Verkoopsignalen</h3><p class="klein">Vink aan wat gebeurd is. Eén geraakt signaal betekent: de reden om dit aandeel te houden klopt mogelijk niet meer.</p>
              <ul class="signalen">${r.verkoopsignalen.map((t, n) => `<li class="${opv.geraakt[n] ? "aan" : ""}"><input type="checkbox" id="sig-${n}" data-n="${n}" ${opv.geraakt[n] ? "checked" : ""}><label for="sig-${n}">${vet(t)}</label></li>`).join("")}</ul></div>` : ""}
            ${(r.agenda || []).length ? `<div><h3 class="subkop">Data om in de gaten te houden</h3>
              <ul class="agenda">${r.agenda.map(t => { const d = agendaDatum(t); return `<li class="${d && d < vandaag() ? "voorbij" : ""}">${vet(t)}</li>`; }).join("")}</ul></div>` : ""}
            <div class="knoprij"><button class="knop hoofd" type="button" id="opv-ok">Ik heb dit vandaag nagekeken</button><span class="status" id="opv-status" role="status">${opv.nagekeken ? "Laatst nagekeken: " + datum(opv.nagekeken) : ""}</span></div>
            <p class="klein">De app kijkt niets zelf na en stuurt geen meldingen: jij vinkt af. Twijfel je of is het rapport oud? Vraag in Claude Code <code>update ${esc(r.ticker)}</code>.</p>
          </div>
        </details>` : ""}`;
      $("#pos-form").addEventListener("submit", async e => {
        e.preventDefault();
        const aankoop = num($("#pos-aankoop").value), st = $("#pos-status");
        if (!aankoop) { st.textContent = "Vul je aankoopprijs in (bv. 245,50)."; return; }
        const koers = num($("#pos-koers").value);
        pos = { aankoop, aantal: num($("#pos-aantal").value), koers, koers_datum: koers ? (koers === pos.koers && pos.koers_datum ? pos.koers_datum : vandaag()) : null,
                ticker: r.ticker, naam: r.naam, valuta: v, bijgewerkt: new Date().toISOString() };
        teken(true, $("#b-opv")?.open);
        try { await bewaar("posities/" + tk, pos); } catch { const s2 = $("#pos-status"); if (s2) s2.textContent = "Bewaren lukte niet; de berekening blijft wel staan tot je de pagina sluit."; }
      });
      $("#pos-wis")?.addEventListener("click", async () => { pos = {}; teken(true, $("#b-opv")?.open); try { await bewaar("posities/" + tk, { ticker: r.ticker, verwijderd: new Date().toISOString() }); } catch {} });
      $("#pos-vraag")?.addEventListener("click", () => { const t = $("#vraag"); if (!t) return; t.value = "Ik bezit dit aandeel. Wat doe ik best met mijn positie, en waarom?"; $("#vf").requestSubmit(); window.scrollTo({ top: 0, behavior: "smooth" }); });
      const bewaarOpv = async () => { opv = { ...opv, rapport: r.id, ticker: r.ticker, bijgewerkt: new Date().toISOString() }; try { await bewaar("opvolging/" + r.id, opv); } catch {} };
      host.querySelectorAll(".signalen input").forEach(c => c.addEventListener("change", () => { opv.geraakt[c.dataset.n] = c.checked; teken($("#b-pos").open, true); bewaarOpv(); }));

  async function laadRapportHtml(r) {
    const host = $("#rapport-host"), st = $("#r-status");
    try {
      const res = await fetch(r.html);
      if (!res.ok) throw new Error(res.status);
      const doc = new DOMParser().parseFromString(await res.text(), "text/html");
      const css = [...doc.querySelectorAll("style")].map(s => s.textContent).join("\n")
        .replace(/:root/g, ":host").replace(/(^|[\s,}])html\s*\{/g, "$1.rb {").replace(/(^|[\s,}])body\s*\{/g, "$1.rb {");
      const schaduw = host.shadowRoot || host.attachShadow({ mode: "open" });
      schaduw.addEventListener("keydown", e => {
        if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("term")) { e.preventDefault(); e.target.click(); }
      });
      schaduw.innerHTML = `<style>${css}\n${FB_CSS}\n${SKIN}</style><div class="rb">${doc.body.innerHTML}</div>`;
      // Interne links (#bron-3, #cijfers) binnen het rapport afhandelen; de adresbalk-hash blijft voor de app.
      schaduw.addEventListener("click", e => {
        const term = e.target.closest(".term");
        if (term) { e.preventDefault(); term.setAttribute("aria-expanded", String(term.classList.toggle("open"))); return; }
        const a = e.target.closest("a[href^='#']");
        if (!a) return;
        e.preventDefault();
        const doel = schaduw.getElementById(a.getAttribute("href").slice(1));
        if (!doel) return;
        for (let p = doel; p; p = p.parentElement) if (p.tagName === "DETAILS") p.open = true;
        doel.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      st.textContent = "";
      const delen = [["oordeel", "Oordeel"], ["samenvatting", "Samenvatting"], ["advies", "Advies"], ["vlaggen", "Rode vlaggen"], ["details", "Details"], ["bronnen", "Bronnen"]]
        .filter(([id]) => schaduw.getElementById(id));
      const rn = $("#rnav");
      if (rn) {
        rn.innerHTML = delen.map(([id, n]) => `<button type="button" data-id="${id}">${n}</button>`).join("");
        rn.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
          const d = schaduw.getElementById(b.dataset.id); if (d.tagName === "DETAILS") d.open = true;
          d.scrollIntoView({ behavior: "smooth", block: "start" });
        }));
      }
      voegFeedbackToe(r, schaduw);
    } catch (e) {
      st.textContent = "Het rapport kon niet geladen worden. Herlaad de pagina.";
      st.classList.add("fout");
    }
  }

  async function downloadPdf(r) {
    const st = $("#pdf-status");
    const dl = await cap.downloads;
    if (!dl) { st.textContent = "Downloaden kan niet in deze weergave. Open de app in claude.ai of de Claude-app."; return; }
    try {
      st.textContent = "PDF ophalen…";
      const blob = await (await fetch(r.pdf)).blob();
      await dl.save({ filename: `${r.naam.replace(/[^A-Za-z0-9 ._-]/g, "")} ${r.datum}.pdf`, data: blob });
      st.textContent = "PDF bewaard.";
    } catch (e) {
      st.textContent = e?.code === "declined" ? "Download geannuleerd." : "Downloaden lukte niet. Probeer opnieuw.";
    }
  }

  // ------------------------------------------------------------ vragen
  const VOORBEELDEN = [
    "Waarom is de score niet hoger?",
    "Leg de rode vlaggen eenvoudig uit.",
    "Wat moet er gebeuren voor dit een koopadvies wordt?",
    "Wanneer zou ik moeten verkopen als ik het bezit?",
  ];
  const context = {};
  async function bouwVragen(r) {
    const p = $("#p-vragen");
    if (p.dataset.klaar === r.id) return;
    p.dataset.klaar = r.id;
    const sleutel = "chat:" + r.id;
    let gesprek = opslag.lees(sleutel, []);
    const bewaarGesprek = () => { opslag.schrijf(sleutel, gesprek);
      bewaar("vragen/" + r.id, { gesprek, rapport: r.id, ticker: r.ticker, naam: r.naam, bijgewerkt: new Date().toISOString(), verwerkt: false }).catch(() => {}); };
    p.innerHTML = `
      <form class="invoer" id="vf"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><label for="vraag" hidden>Vraag over dit rapport</label><textarea id="vraag" rows="1" placeholder="Vraag iets over dit rapport…"></textarea><button class="stuur" type="submit" id="stuur" aria-label="Vraag versturen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></form>
      <div class="status" id="v-status" role="status"></div>
      <div class="voorbeelden" id="vb"></div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div id="eerder"></div>`;
    const chat = $("#chat"), vb = $("#vb"), st = $("#v-status");
    const teken = () => {
      // Nieuwste vraag + antwoord meteen zichtbaar; oudere ingeklapt.
      const paren = [];
      for (let i = 0; i < gesprek.length; i += 2) paren.push(gesprek.slice(i, i + 2));
      paren.reverse();
      const paarHtml = pr => `<div class="paar">${pr.map(b => `<div class="bericht ${b.role === "user" ? "jij" : "claude"}">${b.role === "user" ? esc(b.content) : opmaak(b.content)}</div>`).join("")}</div>`;
      chat.innerHTML = paren.length ? paarHtml(paren[0]) : "";
      $("#eerder").innerHTML = paren.length > 1 || paren.length ? `<details class="eerder"><summary>${paren.length > 1 ? `Eerdere vragen (${paren.length - 1})` : "Opties"}</summary>${paren.slice(1).map(paarHtml).join("")}<button class="knop" type="button" id="wis">Vragen wissen</button></details>` : "";
      $("#wis")?.addEventListener("click", () => { gesprek = []; bewaarGesprek(); teken(); });
      vb.innerHTML = gesprek.length ? "" : VOORBEELDEN.map(v => `<button type="button">${esc(v)}</button>`).join("");
      vb.querySelectorAll("button").forEach(b => b.addEventListener("click", () => { $("#vraag").value = b.textContent; vraag(); }));
    };
    const sample = await cap.sample;
    if (!sample) { st.textContent = "Vragen stellen kan niet in deze weergave. Open de app in claude.ai of de Claude-app."; $("#stuur").disabled = true; }
    teken();
    bewaard("vragen/" + r.id).then(d => { if ((d.gesprek || []).length > gesprek.length && !bezig) { gesprek = d.gesprek; opslag.schrijf(sleutel, gesprek); teken(); } });
    let bezig = false;
    async function vraag() {
      const t = $("#vraag").value.trim();
      if (!t || bezig || !sample) return;
      bezig = true; $("#stuur").disabled = true; $("#vraag").value = "";
      gesprek.push({ role: "user", content: t });
      teken();
      const bubbel = document.createElement("div");
      bubbel.className = "bericht claude"; bubbel.textContent = "Even nadenken…";
      chat.firstElementChild ? chat.firstElementChild.appendChild(bubbel) : chat.appendChild(bubbel);
      st.textContent = ""; st.classList.remove("fout");
      try {
        if (!context[r.id]) context[r.id] = await (await fetch(r.vraag)).text();
        const instructie = `Je bent de hoofdanalist van een klein team dat beleggingsrapporten maakt voor één persoon: een beginnende Belgische belegger. Antwoord in het Nederlands, duidelijk en in volledige zinnen, in gewone taal (leg vaktermen uit). Leg bij vragen over de score uit hoe de scoreopbouw (advies.score_opbouw: punten per onderdeel × gewicht, min correcties voor harde regels) tot het totaal komt. Baseer je ENKEL op het rapport, het werkdossier en de teamreview hieronder. Verzin niets. Staat het antwoord er niet in, zeg dat eerlijk en stel voor om in Claude Code "update ${r.ticker}" of een gerichte onderzoeksvraag te stellen. Verwijs naar bronnen als [n], met n het volgnummer van de bron in de lijst "bronnen" van het rapport (eerste = 1). Maak duidelijk wat een feit is en wat een mening of inschatting. Dit is geen gereglementeerd financieel advies.${positieTekst(r)}\n\nRAPPORT, WERKDOSSIER EN REVIEW (JSON):\n${context[r.id]}`;
        const berichten = gesprek.map((b, i) => i === 0 ? { role: "user", content: instructie + "\n\nEERSTE VRAAG: " + b.content } : b);
        const { text, truncated } = await sample(berichten, { cache: false, onText: ({ text }) => { bubbel.innerHTML = opmaak(text); } });
        gesprek.push({ role: "assistant", content: text + (truncated ? "\n\n(Antwoord afgebroken — vraag gerust verder.)" : "") });
        bewaarGesprek();
      } catch (e) {
        gesprek.pop();
        $("#vraag").value = t;
        st.classList.add("fout");
        st.textContent = e?.code === "not_granted" ? "Je gaf geen toestemming om Claude te gebruiken op deze pagina." :
          e?.code === "rate_limited" ? "Je gebruikslimiet is (even) bereikt. Probeer later opnieuw." : "Er ging iets mis. Probeer opnieuw.";
      }
      bezig = false; $("#stuur").disabled = !sample;
      teken();
    }
    $("#vf").addEventListener("submit", e => { e.preventDefault(); vraag(); });
    $("#vraag").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); vraag(); } });
  }
  function positieTekst(r) {
    const p = eigen[r.ticker];
    if (!p?.aankoop) return "";
    const nu = p.koers || r.koers_nu;
    return `\n\nPOSITIE VAN DE GEBRUIKER (door hem ingevuld in de app): hij bezit dit aandeel${p.aantal ? `, ${p.aantal} stuks` : ""}, gekocht aan gemiddeld ${p.aankoop} ${r.valuta || ""} per aandeel. ${p.koers ? `Koers volgens hem op ${p.koers_datum}: ${p.koers}.` : `Hij gaf geen koers van vandaag op; reken met de rapportkoers ${r.koers_nu} (${r.koers_datum || r.datum}) en zeg dat erbij.`} Zijn stop-loss is 20% onder zijn aankoopprijs = ${(p.aankoop * 0.8).toFixed(2)}. Resultaat nu: ${pct(nu, p.aankoop)}. Vraagt hij wat hij met zijn positie moet doen, antwoord dan voor iemand die het al bezit (houden, bijkopen, deels of helemaal verkopen), op basis van het oordeel, de verkoopsignalen, het koersdoel, de scenario's en zijn stop-loss, en zeg duidelijk dat de beslissing bij hem ligt.`;
  }
  function opmaak(t) {
    try { return window.marked ? window.marked.parse(esc(t).replace(/&gt;/g, ">")) : esc(t).replace(/\n/g, "<br>"); }
    catch { return esc(t).replace(/\n/g, "<br>"); }
  }

  const fb = { ref: null, data: null, rij: Promise.resolve(), r: null };
  async function laadFb(r) {
    const db = await cap.db;
    if (!db) return false;
    fb.r = r; fb.ref = db.doc("feedback/" + r.id);
    try { const s = await fb.ref.get(); fb.data = s.exists ? s.data() : {}; } catch { fb.data = {}; }
    fb.data.secties ||= {};
    return true;
  }
  function bewaarFb(patch) {
    // Eén schrijfactie tegelijk op dit document.
    fb.rij = fb.rij.then(async () => {
      const r = fb.r;
      fb.data = { ...fb.data, ...patch, rapport: r.id, ticker: r.ticker, naam: r.naam, datum: r.datum,
                  bijgewerkt: new Date().toISOString(), verwerkt: false };
      await fb.ref.set(fb.data);
    });
    return fb.rij;
  }

  function scoreKnoppen(huidig) {

  }

      const d = fb.data.secties[sid] || {};

        <div class="paneel" hidden>
          ${scoreKnoppen(d.score)}
          <label for="fb-${sid}">Commentaar (wat mist, wat klopt niet, wat is nutteloos?)</label>
          <textarea id="fb-${sid}">${esc(d.opmerking || "")}</textarea>
          <div class="rij"><button type="button" class="bewaar">Bewaren</button><span class="st" role="status"></span></div>
        </div>`;
      let score = d.score || null;
      const paneel = w.querySelector(".paneel"), open = w.querySelector(".open");
      open.addEventListener("click", () => { paneel.hidden = !paneel.hidden; open.setAttribute("aria-expanded", String(!paneel.hidden)); });

        <label for="fbt-extra">Wat moet extra onderzocht worden?</label><textarea id="fbt-extra">${esc(d.extra || "")}</textarea>
        <label for="fbt-nut">Wat was nutteloos?</label><textarea id="fbt-nut">${esc(d.nutteloos || "")}</textarea>
        <label for="fbt-opm">Andere opmerkingen</label><textarea id="fbt-opm">${esc(d.opmerking || "")}</textarea>
        <div class="rij"><button type="button" class="bewaar">Feedback bewaren</button><span class="st" role="status">${d.verwerkt ? "Eerdere feedback is al verwerkt door Claude." : ""}</span></div>
      </div></div>`;
    let score = d.score || null;
    w.querySelectorAll(".sc button").forEach(b => b.addEventListener("click", () => {
      score = +b.dataset.s; w.querySelectorAll(".sc button").forEach(x => x.setAttribute("aria-pressed", String(+x.dataset.s === score)));
    }));
    w.querySelector(".bewaar").addEventListener("click", async e => {
      const st = w.querySelector(".st");
      if (!score) { st.textContent = "Kies eerst een score."; return; }
      e.target.disabled = true; st.textContent = "Bewaren…";
      try {
        await bewaarFb({ score, extra: w.querySelector("#fbt-extra").value.trim(), nutteloos: w.querySelector("#fbt-nut").value.trim(), opmerking: w.querySelector("#fbt-opm").value.trim() });
        st.textContent = "Bewaard. Claude verwerkt dit bij de volgende sessie.";
      } catch { st.textContent = "Bewaren lukte niet. Probeer opnieuw."; }
      e.target.disabled = false;
    });
    return w;
  }

  async function voegFeedbackToe(r, schaduw) {
    if (!(await laadFb(r))) {
      const n = document.createElement("p"); n.className = "status";
      n.textContent = "Feedback geven kan niet in deze weergave. Open de app in claude.ai of de Claude-app.";
      $("#p-rapport").appendChild(n); return;
    }
    const slug = t => t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    // Adviesblok
    const advies = schaduw.querySelector(".advies");
    if (advies) { const w = maakWidget("advies", "Advies en scenario's"); w.style.gridColumn = "1 / -1"; advies.appendChild(w); }
    // Kaarten (rode vlaggen, samenvatting, teamreview, …) behalve bronnen/legende/inhoud
    schaduw.querySelectorAll(".kaart").forEach(k => {
      const t = k.querySelector("h2")?.textContent.trim() || "";
      if (/^(Bronnen|Hoe lees|Woordenlijst)/.test(t)) return;
      k.appendChild(maakWidget(slug(t.replace(/^\W+/, "")) || "kaart", t.replace(/^\W+/, "")));
    });
    // Hoofdstukken
    schaduw.querySelectorAll("details.sectie").forEach(d => {
      const t = d.querySelector("summary")?.innerText.split("\n")[0].replace(/^\d+\.\s*/, "").trim() || d.id;
      d.querySelector(".inhoud")?.appendChild(maakWidget(d.id, t));
    });
    // Totaal onderaan het rapport (vóór de voetnoot)
    const main = schaduw.querySelector("main");
    const bronnen = [...schaduw.querySelectorAll(".kaart")].find(k => /^Bronnen/.test(k.querySelector("h2")?.textContent.trim() || ""));
    (bronnen ? bronnen.parentNode.insertBefore(maakTotaal(), bronnen) : main?.appendChild(maakTotaal()));
  }

  // ------------------------------------------------------------ vergelijken
  function vergelijkHtml(l) {
    const v = l[0].valuta || "";
    const kort = d => new Date(d + "T12:00:00").toLocaleDateString("nl-BE", { day: "numeric", month: "short", year: "numeric" });
    const punten = [
      ["Oordeel", i => i.oordeel || "–"], ["Score", i => i.score != null ? i.score + "/10" : "–"],
      ["Koers", i => getal(i.koers_nu, v)], ["Koopzone", i => i.koopzone ? `${getal(i.koopzone.van)} – ${getal(i.koopzone.tot, v)}` : "–"],
      ["Koersdoel", i => getal(i.koersdoel, v)], ["Stop-loss (bij aankoop in de koopzone)", i => getal(i.stop_loss, v)],
      ["Intrinsieke waarde", i => getal(i.intrinsieke_waarde, v)],
      ["Scenario's (slecht / normaal / goed)", i => (i.scenarios || []).map(x => `${getal(x.koers)}${x.kans ? " (" + x.kans + ")" : ""}`).join(" / ") || "–"],
      ["Rode vlaggen", i => i.rode_vlaggen.filter(x => x.ernst !== "info").map(x => x.titel).join(" · ") || "geen", true],
      ["Reden", i => i.reden || "–", true],
    ];
    let gewijzigd = 0;
    const kaarten = punten.map(([naam, f, tekst]) => {
      const w = l.map(f), anders = w.slice(1).some(x => x !== w[0]);
      if (anders) gewijzigd++;
      const oud = l.slice(1).map((i, n) => w[n + 1] !== w[n] ? `<div class="was">${kort(i.datum)}: ${vet(w[n + 1])}</div>` : "").join("");
      return `<div class="kaart"><div class="lab"><span>${naam}</span>${anders ? `<span class="gew">gewijzigd</span>` : ""}</div>
        <div class="nu ${tekst ? "tekst" : ""}">${vet(w[0])}</div>${anders ? oud : `<div class="gelijk">ongewijzigd sinds ${kort(l[l.length - 1].datum)}</div>`}</div>`;
    }).join("");
    return `<p class="klein">Bovenaan staat telkens de nieuwste waarde; daaronder wat het vroeger was. ${gewijzigd} van de ${punten.length} punten zijn gewijzigd.</p><div class="vgl">${kaarten}</div>`;
  }

  // ------------------------------------------------------------ bedrijfspagina: laatste stand + tijdlijn
  async function toonBedrijf(tk) {
    zetNav("rapporten");
    const el = $("#inhoud");
    let m;
    try { m = await laadManifest(); } catch { el.innerHTML = `<p class="status fout">Kon de rapportenlijst niet laden.</p>`; return; }
    const l = m.rapporten.filter(x => tkSlug(x.ticker) === tk).sort((a, b) => b.datum.localeCompare(a.datum));
    if (!l.length) { el.innerHTML = `<p class="status fout">Geen rapporten gevonden. <a href="#rapporten">Terug</a>.</p>`; return; }
    const r = l[0], v = r.valuta || "", oud = dagenSinds(r.datum);
    actief = r;
    const vlaggen = r.rode_vlaggen.filter(x => x.ernst !== "info");
    const verschil = (nieuw, vorig) => [
      ["Oordeel", i => i.oordeel], ["Score", i => i.score != null ? i.score + "/10" : null], ["Koers", i => getal(i.koers_nu, v)],
      ["Koopzone", i => i.koopzone ? `${getal(i.koopzone.van)}–${getal(i.koopzone.tot)}` : null], ["Koersdoel", i => getal(i.koersdoel, v)],
      ["Intrinsieke waarde", i => getal(i.intrinsieke_waarde, v)], ["Rode vlaggen", i => i.rode_vlaggen.filter(x => x.ernst !== "info").map(x => x.regel || x.titel).join(", ") || "geen"],
    ].filter(([, f]) => f(nieuw) !== f(vorig)).map(([n, f]) => `<span class="chip">${n}: ${esc(f(vorig) ?? "–")} → <b>${esc(f(nieuw) ?? "–")}</b></span>`).join("");
    el.innerHTML = `
      <div class="rbalk"><a class="terug" href="#rapporten">← Rapporten</a><a class="knop hoofd" href="#r-${esc(r.id)}">Lees het volledige rapport</a></div>
      <div class="kaart stand">
        <div class="k-top"><span class="k-ticker">${esc(r.ticker)}</span>${oordeelHtml(r)}</div>
        <div class="k-score" aria-label="score ${r.score ?? "–"} op 10"><b>${r.score ?? "–"}</b><small>/10</small></div>
        <h1 class="k-naam">${esc(r.naam)}</h1>
        <div class="k-meta">Laatste stand: ${r.soort === "snelle_update" ? "snelle update" : "rapport"} van ${datum(r.datum)} (${geleden(oud)})${r.sector ? " · " + esc(r.sector) : ""}</div>
        <div class="stand-reden">${vet(r.reden)}</div>
        ${prijsbalk(r)}
        <div class="k-onder">${r.defensief ? `<span class="chip def">Defensief</span>` : ""}${vlaggen.map(x => `<span class="chip ${esc(x.ernst)}">${esc(ERNST[x.ernst] || x.ernst)}${x.regel ? " · " + esc(x.regel) : ""}</span>`).join("")}${!vlaggen.length ? `<span class="chip">Geen rode vlaggen</span>` : ""}${oud > 90 ? `<span class="chip oud">Meer dan 3 maanden oud: vraag een update</span>` : ""}</div>
      </div>
      <section id="p-vragen" class="vraagblok" aria-label="Vragen over dit bedrijf"></section>
      <section id="p-eigen" aria-label="Jouw positie en opvolging"></section>
      <h2 class="sectiekop">Tijdlijn</h2>
      <ol class="tijdlijn">${l.map((i, n) => { const vorig = l[n + 1]; return `<li>
        <div class="tl-kop"><strong>${datum(i.datum)}</strong> · ${i.soort === "snelle_update" ? "snelle update" : vorig ? "update" : "eerste rapport"} · ${esc(i.oordeel || "–")} ${i.score != null ? i.score + "/10" : ""}</div>
        ${vorig ? `<div class="tl-kern">${vet(i.kern || "Geen samenvatting van de wijzigingen.")}</div><div class="k-onder">${verschil(i, vorig) || `<span class="chip">Geen cijfer van het advies gewijzigd</span>`}</div>` : `<div class="tl-kern">${vet(i.reden)}</div>`}
        <a class="knop" href="#r-${esc(i.id)}">${n === 0 ? "Lees dit rapport" : "Open dit oudere rapport"}</a></li>`; }).join("")}</ol>
      ${l.length > 1 ? `<details class="blok"><summary>Alle cijfers naast elkaar<small>${l.length} rapporten</small></summary><div class="blok-in">${vergelijkHtml(l)}</div></details>` : ""}`;
    bouwVragen(r);
    bouwEigen(r);
  }

  // ------------------------------------------------------------ profiel
  async function toonProfiel() {
    zetNav("profiel");
    const el = $("#inhoud");
    el.innerHTML = `<div class="eyebrow">Zo kent het team je</div><h1>Profiel</h1><p class="sub">Zo kent het team je. Wijzigingen stelt Claude eerst voor; jij beslist.</p>
      <h2 class="sectiekop">Voorstellen die op jouw akkoord wachten</h2><div class="md" id="md-v">Laden…</div>
      <h2 class="sectiekop">Feedback die nog verwerkt moet worden</h2><div class="fbl" id="fb-lijst"><p class="status">Laden…</p></div>
      <h2 class="sectiekop">Je profiel</h2><div class="md" id="md-p">Laden…</div>`;
    const md = async (pad, doel, schoon = t => t) => {
      try {
        const t = schoon(await (await fetch(pad, { cache: "no-store" })).text());
        $(doel).innerHTML = window.marked ? window.marked.parse(t) : `<pre>${esc(t)}</pre>`;
        $(doel).querySelectorAll("table").forEach(tb => { const w = document.createElement("div"); w.className = "tw"; tb.replaceWith(w); w.appendChild(tb); });
      } catch { $(doel).textContent = "Kon niet geladen worden."; }
    };
    // Enkel wat voor de lezer telt: open voorstellen, en het profiel zonder werknotities en bestandsnamen.
    md("profiel/voorstellen.md", "#md-v", t => {
      const open = (/## Open\s*([\s\S]*?)(?=\n## |$)/.exec(t) || [0, ""])[1].trim();
      return !open || /^_?\(geen\)_?$/.test(open) ? "Er wacht niets op jouw akkoord. Wil je iets aan je profiel veranderen, zeg het dan in Claude Code." : open;
    });
    md("profiel/PROFIEL.md", "#md-p", t => t.replace(/^# .*\n/, "").replace(/^>.*\n/gm, "").replace(/\s*\*\((gewijzigd|toegevoegd)[^)]*\)\*/g, "")
      .replace(/## 8\.[\s\S]*$/, "").replace(/`/g, ""));
    const db = await cap.db, lijst = $("#fb-lijst");
    if (!db) { lijst.innerHTML = `<p class="status">Niet beschikbaar in deze weergave.</p>`; return; }
    try {
      const q = await db.collection("feedback").where("verwerkt", "==", false).get();
      const docs = q.docs.map(d => d.data());
      lijst.innerHTML = docs.length ? docs.map(d => `<div class="kaart"><strong>${esc(d.naam)}</strong> · ${datum(d.datum)} · ${d.score ? "score " + d.score + "/10" : "geen totaalscore"}${d.extra ? `<br>Extra: ${esc(d.extra)}` : ""}${d.nutteloos ? `<br>Nutteloos: ${esc(d.nutteloos)}` : ""}${d.opmerking ? `<br>${esc(d.opmerking)}` : ""}${Object.values(d.secties || {}).map(x => `<br>· <em>${esc(x.titel)}</em>${x.score ? ` (${x.score}/10)` : ""}${x.opmerking ? ": " + esc(x.opmerking) : ""}`).join("")}</div>`).join("")
        : `<p class="status">Geen openstaande feedback.</p>`;
    } catch { lijst.innerHTML = `<p class="status">Kon niet geladen worden.</p>`; }
  }

  // ------------------------------------------------------------ routering
  function route() {
    const h = location.hash.slice(1);
    window.scrollTo(0, 0);
    if (h === "profiel") return toonProfiel();
    if (h.startsWith("r-")) return toonRapport(h.slice(2));
    if (h.startsWith("b-") || h.startsWith("v-")) return toonBedrijf(h.slice(2));
    return toonOverzicht();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
